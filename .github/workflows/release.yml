name: Release

# Publishes the JAR and native installers as a GitHub Release, either by pushing a
# tag like v1.0.0 or by running this workflow from the Actions tab with a version
# (the tag is then created on the selected branch's commit). Pull requests that
# touch the build run the same packaging, without publishing, to catch breakage early.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'build.gradle'
      - 'src/main/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.0 (creates tag v1.0.0). Leave empty to only build.'
        required: false
        default: ''

env:
  APP_NAME: EventCalendar

jobs:
  package:
    name: package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
            type: deb
          - os: windows-latest
            label: windows-x64
            type: msi
          - os: macos-latest
            label: macos-arm64
            type: dmg
          - os: macos-15-intel
            label: macos-x64
            type: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compute version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ -n "$INPUT_VERSION" ]]; then
            echo "VERSION=${INPUT_VERSION#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build JAR
        run: ./gradlew jar --no-daemon

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Ensure WiX is on PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v candle.exe >/dev/null; then
            wix_bin=$(ls -d "/c/Program Files (x86)"/WiX\ Toolset*/bin 2>/dev/null | head -1)
            if [ -z "$wix_bin" ]; then
              choco install wixtoolset -y --no-progress
              wix_bin=$(ls -d "/c/Program Files (x86)"/WiX\ Toolset*/bin | head -1)
            fi
            echo "$wix_bin" >> "$GITHUB_PATH"
          fi

      - name: Package with jpackage
        run: |
          mkdir -p dist
          common=(
            --type "${{ matrix.type }}"
            --name "$APP_NAME"
            --app-version "$VERSION"
            --vendor "Aniket Nandi"
            --description "Calendar app with multiple time zones, recurring events and iCal/CSV export"
            --input build/libs
            --main-jar calendar-1.0.jar
            --main-class CalendarRunner
            --add-modules java.base,java.desktop
            --jlink-options "--strip-debug --no-man-pages --no-header-files --strip-native-commands"
            --dest dist
          )
          case "${{ matrix.type }}" in
            deb) extra=(--linux-shortcut --linux-menu-group Office --linux-package-name eventcalendar) ;;
            msi) extra=(--win-menu --win-shortcut --win-dir-chooser --win-per-user-install
                        --win-upgrade-uuid 6f3c2a9e-4b1d-4f5e-9c7a-2d8e1b0a7c41) ;;
            dmg) extra=(--mac-package-identifier com.aniketnandi.eventcalendar) ;;
          esac
          jpackage "${common[@]}" "${extra[@]}"
          # Version-less asset names keep the README's "latest release" download links stable.
          mv dist/*."${{ matrix.type }}" "dist/$APP_NAME-${{ matrix.label }}.${{ matrix.type }}"
          if [ "${{ runner.os }}" = Linux ]; then
            cp build/libs/calendar-1.0.jar "dist/$APP_NAME.jar"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compute tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${INPUT_VERSION#v}"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$tag')"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            | Platform | File | Needs Java? |
            | --- | --- | --- |
            | Windows | `EventCalendar-windows-x64.msi` | No |
            | macOS (Apple Silicon) | `EventCalendar-macos-arm64.dmg` | No |
            | macOS (Intel) | `EventCalendar-macos-x64.dmg` | No |
            | Linux (Debian/Ubuntu) | `EventCalendar-linux-amd64.deb` | No |
            | Any OS | `EventCalendar.jar` | Java 17+ |

            The installers include their own Java runtime. They are not code-signed:
            on macOS, right-click the app and choose **Open** the first time; on Windows,
            choose **More info → Run anyway** if SmartScreen appears.
