plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.15.0'
}

group 'calendar'
version '1.0'

repositories {
    mavenCentral()
}

// Build, test and run with JDK 17 whatever JDK launches Gradle, so the JAR runs on any
// Java 17+ runtime. Gradle uses a local JDK 17 if it finds one, otherwise downloads it.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Sources are UTF-8; don't depend on the platform default (e.g. cp1252 on Windows).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.testng:testng:7.1.0'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'CalendarRunner'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = false
        csv.required = true
    }
}

test {
    useJUnit()
    finalizedBy tasks.jacocoTestReport
}

application {
    mainClass = 'CalendarRunner'
}

checkstyle {
    toolVersion = '10.23.1'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    //maxWarnings = 0//
    ignoreFailures = true
}

tasks.withType(Checkstyle) {
    reports {
        xml.required = true
        html.required = true
    }
}

pitest {
    targetClasses = ['calendar.*']
    targetTests = ['*']
    pitestVersion = '1.15.8'
    threads = 4
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    testPlugin = 'junit'
    verbose = true
    exportLineCoverage = true
    failWhenNoMutations = false
    // PIT reads sources with the JVM default charset when rendering reports.
    mainProcessJvmArgs = ['-Dfile.encoding=UTF-8']
}

// The PIT plugin doesn't follow the toolchain on its own; run it (and its test minions)
// on the same JDK 17 that compiled the classes.
tasks.named('pitest') {
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.named('run', JavaExec) {
    standardInput = System.in
}